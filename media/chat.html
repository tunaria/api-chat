<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { font-family: var(--vscode-font-family); color: var(--vscode-foreground); background: var(--vscode-editor-background); margin: 0; display: flex; flex-direction: column; height: 100vh; }
  #bar { display: flex; gap: 6px; padding: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--vscode-panel-border); }
  #bar input, #bar select { background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border, transparent); padding: 3px; }
  #cwd { flex: 1; min-width: 12rem; }
  #log { flex: 1; overflow-y: auto; padding: 8px; }
  .m { white-space: pre-wrap; margin: 6px 0; padding: 6px 8px; border-radius: 4px; }
  .you { background: var(--vscode-input-background); }
  .tool { font-family: var(--vscode-editor-font-family); font-size: 0.85em; opacity: 0.7; }
  .sub { border-left: 3px solid var(--vscode-textLink-foreground); padding-left: 8px; }
  .sys { font-size: 0.85em; opacity: 0.7; font-style: italic; }
  .err { color: var(--vscode-errorForeground); font-size: 0.85em; }
  .ask { border: 1px solid var(--vscode-focusBorder); }
  .ask pre { white-space: pre-wrap; max-height: 14em; overflow: auto; font-size: 0.85em; }
  .ask .btns { display: flex; gap: 6px; }
  #in { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--vscode-panel-border); }
  textarea { flex: 1; min-height: 4em; resize: vertical; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border, transparent); font-family: inherit; }
  button { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: 0; padding: 4px 10px; cursor: pointer; }
  button.sec { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); }
  button:disabled { opacity: 0.5; }
</style></head>
<body>
<div id="bar">
  <input id="cwd" title="Working folder">
  <select id="model">
    <option value="claude-opus-5-5">Opus 5.5</option>
    <option value="claude-sonnet-5-5" selected>Sonnet 5.5</option>
    <option value="claude-haiku-5-5">Haiku 5.5</option>
  </select>
  <select id="mode" title="Permission mode">
    <option value="default" selected>ask for everything</option>
    <option value="acceptEdits">auto-accept file edits</option>
    <option value="plan">plan only</option>
  </select>
  <button id="new" class="sec">New</button>
</div>
<div id="log"></div>
<div id="in">
  <textarea id="text" placeholder="Prompt (Ctrl+Enter to send)"></textarea>
  <div style="display:flex;flex-direction:column;gap:6px"><button id="send">Send</button><button id="stop" class="sec" disabled>Stop</button></div>
</div>
<script>
  const vs = acquireVsCodeApi();
  const $ = (id) => document.getElementById(id);
  const scroll = () => { $('log').scrollTop = 1e9; };
  const add = (cls, text) => { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = text; $('log').appendChild(d); scroll(); return d; };
  function send() {
    const text = $('text').value.trim(); if (!text) return;
    add('you', text); $('text').value = '';
    vs.postMessage({ type: 'send', text, cwd: $('cwd').value, model: $('model').value, mode: $('mode').value });
  }
  function ask(m) {
    const d = add('ask' + (m.sub ? ' sub' : ''), (m.sub ? 'Subagent wants: ' : 'Wants: ') + m.tool);
    const pre = document.createElement('pre'); pre.textContent = m.input; d.appendChild(pre);
    const b = document.createElement('div'); b.className = 'btns'; d.appendChild(b);
    const answer = (decision) => { vs.postMessage({ type: 'answer', id: m.id, decision }); b.remove(); add('sys', decision + ': ' + m.tool); };
    for (const [label, dec, cls] of [['Allow', 'allow', ''], ['Always allow ' + m.tool, 'always', 'sec'], ['Deny', 'deny', 'sec']]) {
      const btn = document.createElement('button'); btn.textContent = label; if (cls) btn.className = cls; btn.onclick = () => answer(dec); b.appendChild(btn);
    }
    scroll();
  }
  $('send').onclick = send;
  $('stop').onclick = () => vs.postMessage({ type: 'stop' });
  $('new').onclick = () => vs.postMessage({ type: 'new' });
  $('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) send(); });
  window.addEventListener('message', ({ data: m }) => {
    if (m.type === 'init') $('cwd').value = m.cwd;
    else if (m.type === 'busy') { $('send').disabled = m.on; $('stop').disabled = !m.on; }
    else if (m.type === 'ask') ask(m);
    else add((m.type === 'text' ? 'bot' : m.type) + (m.sub ? ' sub' : ''), m.text);
  });
</script>
</body></html>
